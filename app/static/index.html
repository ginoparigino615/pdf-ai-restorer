<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF AI Restorer v2</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<h1>PDF AI Restorer</h1>
<p class="sub">Restauro automatico • Revisione • AI selettiva</p>

<section class="card">
<h2>1. Carica PDF</h2>
<input id="file" type="file" accept=".pdf,application/pdf">
<button id="create">Crea progetto</button>
<p id="msg"></p>
</section>

<section class="card hidden" id="project">
<h2>2. Restauro automatico</h2>
<div class="bar"><div id="bar"></div></div>
<p id="status">—</p>
<div class="buttons">
<button id="start">Avvia restauro</button>
<button id="pause">Pausa</button>
<a id="download" class="download hidden">Scarica PDF restaurato</a>
</div>
</section>

<section class="card hidden" id="review">
<h2>3. Revisione</h2>
<p>Seleziona pagine singole o intervalli, ad esempio <b>120-145, 200, 305-310</b>.</p>
<input id="pages" placeholder="1-3, 7, 10-11">
<button id="ai">Migliora selezionate</button>
<pre id="details"></pre>
</section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
