<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF AI Restorer</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>PDF AI Restorer</h1><p>Restauro automatico • revisione • AI selettiva</p></header><main><section class="card"><h2>1. Carica PDF</h2><input id="file" type="file" accept="application/pdf"><button id="create">Crea progetto</button><p id="jobinfo"></p></section><section class="card hidden" id="progressCard"><h2>2. Restauro automatico</h2><div class="bar"><div id="bar"></div></div><p id="progressText">0 / 0</p><button id="start">Avvia</button><button id="pause">Pausa</button><a id="download" class="button hidden">Scarica PDF</a></section><section class="card hidden" id="reviewCard"><h2>3. Revisione</h2><p>Puoi selezionare singole pagine o intervalli, per esempio 120–145.</p><label>Da <input id="from" type="number" min="1" value="1"></label><label>A <input id="to" type="number" min="1" value="1"></label><button id="addRange">Aggiungi intervallo</button><p><input id="single" placeholder="Pagine: 12,18,25"><button id="addSingle">Aggiungi</button></p><div id="selected"></div><button id="ai">✨ Migliora selezionate con AI</button><p id="queue"></p><div id="review"></div></section></main><script src="/static/app.js"></script></body></html>
